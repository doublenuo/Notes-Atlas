name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: documentation-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build VitePress site
        run: pnpm docs:build

      # 用 rsync over SSH 增量发布(不用 scp-action):
      #   -c        内容校验,跳过未变文件(每次只传真正改动的页面/哈希资源)
      #   --delete   清除服务端已不存在的旧页面(与 scp 拷贝式上传不同,避免"先清空"导致站点空窗)
      #   --partial  跨境链路抖动时保留半截文件,配合下面的重试
      #   keepalive 长连接保活;慢带宽(约 1-10 Mbps)下大站首传可能数分钟,故重试 3 次
      - name: Deploy site to server
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PORT: ${{ secrets.SERVER_PORT || 22 }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -p $DEPLOY_PORT -i ~/.ssh/deploy_key -o ServerAliveInterval=15 -o ServerAliveCountMax=6"
          for attempt in 1 2 3; do
            if rsync -azc --delete --partial -e "$SSH" \
                 docs/.vitepress/dist/ "$DEPLOY_USER@$DEPLOY_HOST:/opt/blogs/"; then
              break
            fi
            echo "rsync attempt $attempt failed, retrying..."
            sleep 10
          done
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'chown -R admin:admin /opt/blogs || true'

      - name: Build site for GitHub Pages
        run: |
          rm -rf docs/.vitepress/dist
          VITEPRESS_BASE=/Notes-Atlas/ pnpm docs:build

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Verify site is live
        run: |
          for path in / /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://blogs.lovetulin.cn$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "health check failed: $path"; exit 1; }
          done

  deploy-pages:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4