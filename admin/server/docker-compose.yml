# code-server 部署：与原 admin 的 fastify 服务同一部署形态（network_mode: host）。
#
# 同步到服务器时排除本文件（生产 compose 可能挂载路径/端口略有差异）：
#   rsync -av --delete --exclude .env --exclude docker-compose.yml \
#         admin/server/ web:/data/stacks/admin/
services:
  code-server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # code-server 密码认证（auth=password，见 entrypoint.sh）
      - PASSWORD=${PASSWORD}
      # git 提交身份
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
      # 扩展市场：用微软官方 marketplace（国内有 CDN，比默认 Open VSX 稳定），
      # 解决 open-vsx.org 偶发超时问题
      - 'EXTENSIONS_GALLERY={"serviceUrl":"https://marketplace.visualstudio.com/_apis/public/gallery","cacheUrl":"https://vscode.blob.core.windows.net/gallery/index","itemUrl":"https://marketplace.visualstudio.com/items"}'
    volumes:
      # vault 工作目录（容器内 /workspace）
      - /opt/notes-atlas:/workspace
      # 部署私钥（git push GitHub 用）；known_hosts 已由镜像构建时预置
      - /root/.ssh/id_rsa:/root/.ssh/id_rsa:ro
      # 持久化 code-server 用户数据（网页界面安装的插件 + settings/快捷键/登录态），
      # 挂到宿主机目录，避免容器重建（重新 build）后丢失
      - ./.code-server-data:/root/.local/share/code-server
    network_mode: host
