<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>当前处于离线状态 | Weno's Blog</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #fafafa;
      color: #213547;
    }
    .card {
      max-width: 420px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
      border: 1px solid rgba(60, 60, 67, .12);
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .06);
    }
    .icon { font-size: 44px; line-height: 1; margin-bottom: 16px; }
    h1 { margin: 0 0 12px; font-size: 22px; font-weight: 600; }
    p { margin: 0 0 28px; color: #6b7280; font-size: 14px; }
    button {
      padding: 9px 22px;
      font-size: 14px;
      font-weight: 500;
      color: #fff;
      background: #3451b2;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity .2s;
    }
    button:hover { opacity: .85; }
    button:focus-visible { outline: 2px solid #3451b2; outline-offset: 3px; }
    @media (prefers-color-scheme: dark) {
      body { background: #1b1b1f; color: #e5e7eb; }
      .card { background: #242427; border-color: rgba(255, 255, 255, .1); }
      p { color: #9ca3af; }
      button { background: #5c73d8; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">&#128244;</div>
    <h1>当前处于离线状态</h1>
    <p>该页面尚未缓存到本地。已浏览过的页面在离线时仍可阅读，恢复网络后点击重试即可。</p>
    <button type="button" onclick="location.reload()">重新加载</button>
  </div>
</body>
</html>
